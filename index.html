<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowX : Scores Exacts</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--accent);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: var(--accent);
        }

        .results {
            display: none;
        }

        .top-scores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .score-box {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .score-box .score {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .score-box .prob {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: center;
        }

        th, td {
            padding: 8px;
            border: 1px solid var(--border);
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
        }

        .gombo-box {
            background-color: #064e3b;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .gombo-box h3 {
            margin: 0 0 10px 0;
            color: #6ee7b7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GrowX : Scores Exacts</h1>
        <p>Modèle Dixon-Coles & Analyse Statistiques</p>
    </div>

    <div class="card">
        <div class="input-group">
            <div>
                <label for="home_xg">xG Équipe Domicile :</label>
                <input type="number" id="home_xg" step="0.01" placeholder="Ex: 1.55" value="1.50">
            </div>
            <div>
                <label for="away_xg">xG Équipe Extérieur :</label>
                <input type="number" id="away_xg" step="0.01" placeholder="Ex: 1.10" value="1.10">
            </div>
        </div>
        <button onclick="calculatePredictions()">Générer l'Analyse</button>
        <div id="loading" class="loading">Calculs en cours...</div>
    </div>

    <div id="results" class="results">
        <!-- Top 3 Scores Exacts -->
        <div class="card">
            <h3>Top 3 Scores Exacts les plus Probables</h3>
            <div id="top3" class="top-scores"></div>
        </div>

        <!-- Pari Gombo Spécial -->
        <div class="card gombo-box">
            <h3>Pari Gombo Spécial</h3>
            <div id="gombo-content"></div>
        </div>

        <!-- Matrice 6x6 -->
        <div class="card">
            <h3>Matrice de Probabilités (6x6)</h3>
            <div class="table-container">
                <table id="matrix-table">
                    <thead>
                        <tr id="matrix-header"></tr>
                    </thead>
                    <tbody id="matrix-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    async function calculatePredictions() {
        const homeXg = parseFloat(document.getElementById('home_xg').value);
        const awayXg = parseFloat(document.getElementById('away_xg').value);
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');

        if (isNaN(homeXg) || isNaN(awayXg)) {
            alert("Veuillez saisir des valeurs xG valides.");
            return;
        }

        loadingDiv.style.display = 'block';
        resultsDiv.style.display = 'none';

        try {
            const response = await fetch('https://growx-app.onrender.com/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ home_xg: homeXg, away_xg: awayXg })
            });

            if (!response.ok) {
                throw new Error("Erreur de réponse du serveur.");
            }

            const data = await response.json();
            displayResults(data);

        } catch (error) {
            alert("Erreur lors de la connexion au serveur backend : " + error.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    }

    function displayResults(data) {
        // 1. Affichage du Top 3
        const top3Div = document.getElementById('top3');
        top3Div.innerHTML = '';
        if (data.top_scores) {
            data.top_scores.slice(0, 3).forEach(item => {
                top3Div.innerHTML += `
                    <div class="score-box">
                        <div class="score">${item.score}</div>
                        <div class="prob">${(item.probability * 100).toFixed(1)}%</div>
                    </div>
                `;
            });
        }

        // 2. Affichage Pari Gombo
        const gomboDiv = document.getElementById('gombo-content');
        if (data.gombo_selection) {
            gomboDiv.innerHTML = `
                <p><strong>Sélection Optimisée :</strong> ${data.gombo_selection.join(', ')}</p>
                <p><strong>Probabilité Cumulée :</strong> ${(data.gombo_probability * 100).toFixed(1)}%</p>
            `;
        } else {
            gomboDiv.innerHTML = `<p>Données indisponibles.</p>`;
        }

        // 3. Affichage Matrice 6x6
        const headerRow = document.getElementById('matrix-header');
        const tbody = document.getElementById('matrix-body');
        headerRow.innerHTML = '<th>Dom / Ext</th>';
        tbody.innerHTML = '';

        if (data.matrix) {
            for (let j = 0; j <= 5; j++) {
                headerRow.innerHTML += `<th>${j}</th>`;
            }

            for (let i = 0; i <= 5; i++) {
                let rowHtml = `<tr><th>${i}</th>`;
                for (let j = 0; j <= 5; j++) {
                    const prob = (data.matrix[i][j] * 100).toFixed(1);
                    rowHtml += `<td>${prob}%</td>`;
                }
                rowHtml += '</tr>';
                tbody.innerHTML += rowHtml;
            }
        }

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
