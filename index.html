<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football AI Analytics GrowX</title>
    <style>
        /* Styles de base pour l'interface sombre */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            color: #10b981;
            margin-bottom: 20px;
        }
        .stat-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .progress-container {
            background-color: #334155;
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar {
            background-color: #ec4899;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
        .stat-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .over-text {
            color: #f472b6;
            font-weight: 600;
        }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Football AI Analytics GrowX</h1>

    <!-- FORMULAIRE DE TEST / ENTRÉE -->
    <div class="stat-card">
        <label>xG Domicile :</label>
        <input type="number" id="home_xg" value="1.42" step="0.01" style="width:100%; padding:8px; margin:5px 0 15px 0; background:#334155; color:#fff; border:none; border-radius:6px;">
        
        <label>xG Extérieur :</label>
        <input type="number" id="away_xg" value="1.30" step="0.01" style="width:100%; padding:8px; margin:5px 0 15px 0; background:#334155; color:#fff; border:none; border-radius:6px;">
        
        <button onclick="lancerAnalyse()">Générer l'Analyse Avancée</button>
    </div>

    <!-- RÉSULTATS : BLOC CARTONS -->
    <div class="stat-card">
        <div class="stat-header">
            <span>Cartons</span>
            <span id="cards-line-label">Ligne 3.5</span>
        </div>
        <div class="progress-container">
            <div id="cards-progress-bar" class="progress-bar"></div>
        </div>
        <div class="stat-footer">
            <span id="cards-over-text" class="over-text">Over 3.5 : --%</span>
            <span id="cards-under-text" class="under-text">--%</span>
        </div>
    </div>

    <!-- RÉSULTATS : BLOC FAUTES -->
    <div class="stat-card">
        <div class="stat-header">
            <span>Fautes</span>
            <span id="fouls-line-label">Ligne 23.5</span>
        </div>
        <div class="progress-container">
            <div id="fouls-progress-bar" class="progress-bar" style="background-color: #3b82f6;"></div>
        </div>
        <div class="stat-footer">
            <span id="fouls-over-text" class="over-text" style="color: #60a5fa;">Over 23.5 : --%</span>
            <span id="fouls-under-text" class="under-text">--%</span>
        </div>
    </div>
</div>

<script>
    // Remplace l'URL par ton API Render si nécessaire (ex: "https://ton-app.onrender.com/predict")
    const API_URL = "http://127.0.0.1:8000/predict"; 

    async function lancerAnalyse() {
        const homeXg = parseFloat(document.getElementById('home_xg').value);
        const awayXg = parseFloat(document.getElementById('away_xg').value);

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    home_xg: homeXg,
                    away_xg: awayXg
                })
            });

            if (!response.ok) {
                throw new Error("Erreur lors de la récupération de l'analyse.");
            }

            const data = await response.json();

            // Mise à jour dynamique des blocs Cartons & Fautes reçus du backend main.py
            if (data.stats) {
                // 1. Cartons
                const cards = data.stats.cards;
                document.getElementById('cards-line-label').innerText = `Ligne ${cards.line}`;
                document.getElementById('cards-progress-bar').style.width = `${cards.over_probability}%`;
                document.getElementById('cards-over-text').innerText = `Over ${cards.line} : ${cards.over_probability}%`;
                document.getElementById('cards-under-text').innerText = `${cards.under_probability}%`;

                // 2. Fautes
                const fouls = data.stats.fouls;
                document.getElementById('fouls-line-label').innerText = `Ligne ${fouls.line}`;
                document.getElementById('fouls-progress-bar').style.width = `${fouls.over_probability}%`;
                document.getElementById('fouls-over-text').innerText = `Over ${fouls.line} : ${fouls.over_probability}%`;
                document.getElementById('fouls-under-text').innerText = `${fouls.under_probability}%`;
            }

        } catch (error) {
            console.error("Erreur:", error);
            alert("Impossible de contacter l'API. Vérifie que le serveur est bien lancé.");
        }
    }
</script>

</body>
</html>
